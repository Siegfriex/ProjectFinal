<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-Lane3 fixture: F3 tracking entry below the fold, nothing covers it (STEP1-012 GAP-05 companion: 0 % occluded but off-viewport → not visible at S0)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;font-family:sans-serif;background:#fff;color:#111}
  header{position:sticky;top:0;height:56px;display:flex;align-items:center;padding:6px 8px;border-bottom:1px solid #ddd;background:#fff;z-index:10}
  header .logo{flex:1;text-align:center;font-weight:700;font-size:18px}
  button,a,input{font:inherit;cursor:pointer}
  [data-screen]{display:none;padding:16px}
  [data-screen].on{display:block}
  .entry{display:block;width:100%;height:90px;border:1px solid #888;border-radius:8px;background:#fff;font-size:18px}
  .tall{height:840px;background:linear-gradient(#e8f0fe,#fff);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:40px;gap:12px;margin-bottom:16px}
  .tall p{font-size:16px;color:#333}
  .list button{display:block;width:100%;text-align:left;padding:14px 12px;margin-top:8px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:16px}
  label{display:block;margin:12px 0 4px;font-size:14px}
  input{width:100%;padding:12px;font-size:16px;border:1px solid #888;border-radius:8px}
  .primary{width:100%;padding:14px;margin-top:16px;background:#1a56db;color:#fff;border:0;border-radius:8px;font-size:16px}
  h1{font-size:20px;margin-bottom:12px}
  /* GAP-05 companion of occluded_but_hittable. No [data-c-overlay] exists and nothing ever covers the entry control
     (hit-test occlusion 0.0 wherever it is observed), but the control is laid out BELOW the 844px fold:
       header 56 + section padding 16 + .tall 840 + margin 16 -> control top = 928px, bottom = 1018px, centre y = 973px.
     At S0 (no scroll) its bbox does not intersect the viewport -> s0_task_control_visible = false and, by the GAP-04
     null convention, task_control_occlusion_s0 = null (not observed). One scroll step (any value in [120, 844] px;
     document height ~1434px so the max scroll offset is ~590px) brings it fully into view: top ~338px, centre
     hit-testable, occlusion 0.0 -> first_visible_scroll_state = S1, task_control_occlusion_all_steps = 0.0.
     Trap for text-binding runners: the S0 hero contains the plain text '배송조회' inside a <p> (data-c-decoy) that is
     not a control; a runner that binds the task control by text reports visible=true at S0 and fails. */
</style>
</head>
<body data-c-state="LANDING" data-c-fixture="unoccluded_but_offscreen" data-c-family="F3" data-c-terminal="">
<header>
  <div style="width:44px"></div>
  <div class="logo">C택배</div>
  <div style="width:44px"></div>
</header>

<section data-screen="LANDING" class="on">
  <div class="tall">
    <p>빠르고 안전한 배송</p>
    <p data-c-decoy="TASK_LABEL_TEXT">배송조회는 아래에서 바로 할 수 있습니다</p>
  </div>
  <!-- header 56 + padding 16 + tall 840 + 16 = control top ≈ 928px (below the 844px fold) -->
  <button class="entry" data-c-action="SELECT_FUNCTION" data-c-task-control="1" data-c-path="1" onclick="selectFunction()">배송조회</button>
  <div class="list">
    <button onclick="noop('예약접수')">예약접수</button>
    <button onclick="noop('고객센터')">고객센터</button>
  </div>
  <div style="height:280px"></div>
</section>

<section data-screen="TRACK" data-c-endpoint="REACHED">
  <h1>배송조회</h1>
  <label for="no">운송장 번호</label>
  <input id="no" inputmode="numeric" placeholder="운송장 번호 입력" data-c-forbidden="TRACKING_NUMBER" oninput="forbidden('TRACKING_NUMBER')">
  <button class="primary" data-c-forbidden="TRACKING_QUERY_SUBMIT" onclick="forbidden('TRACKING_QUERY_SUBMIT')">조회</button>
</section>

<script>
(function(){
  const B=document.body, T=window.__cTransitions=[];
  window.cGo=function(action,state,screen,terminal){
    const before=B.dataset.cState;
    B.dataset.cState=state;
    if(screen){document.querySelectorAll('[data-screen]').forEach(s=>s.classList.toggle('on',s.dataset.screen===screen));window.scrollTo(0,0);}
    if(terminal!==undefined)B.dataset.cTerminal=terminal;
    location.hash=state;
    T.push({before,action,after:state});
  };
  window.noop=function(n){T.push({before:B.dataset.cState,action:'NOOP:'+n,after:B.dataset.cState});};
  window.forbidden=function(n){T.push({before:B.dataset.cState,action:'FORBIDDEN_ACTIVATED:'+n,after:B.dataset.cState});B.dataset.cForbiddenHit=(parseInt(B.dataset.cForbiddenHit||'0')+1);};
  window.selectFunction=function(){if(B.dataset.cState!=='LANDING')return;cGo('SELECT_FUNCTION','ENDPOINT_TRACKING_FORM','TRACK','ENDPOINT_REACHED');};
})();
</script>
</body>
</html>
