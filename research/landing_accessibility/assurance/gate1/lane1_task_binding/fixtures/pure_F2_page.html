<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>씨마켓 - 생활용품 · 식품 · 생수 온라인 쇼핑</title>
<meta name="description" content="씨마켓 모바일. 생활용품, 식품, 생수를 검색하고 상품 상세를 확인하세요.">
<meta name="c-fixture" content="pure_F2_page">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;width:390px;margin:0 auto;background:#fff;color:#111}
  header{display:flex;align-items:center;gap:8px;padding:10px;background:#ff5a1f;color:#fff}
  header .logo{font-weight:700;font-size:18px;flex:1}
  header button,header a{background:none;border:0;color:#fff;font-size:20px;min-width:44px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .searchbar{display:flex;gap:6px;padding:8px 10px;background:#fff3ec}
  .searchbar input{flex:1;height:44px;border:1px solid #ff5a1f;border-radius:22px;padding:0 16px;font-size:15px}
  .searchbar button{width:64px;height:44px;border:0;border-radius:22px;background:#ff5a1f;color:#fff;font-size:15px}
  .cats{display:flex;gap:8px;padding:10px;overflow-x:auto}
  .cats button{flex:0 0 auto;height:36px;padding:0 14px;border:1px solid #ddd;border-radius:18px;background:#fff;font-size:14px}
  .hero{margin:10px;height:120px;background:#ffe3d6;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .hidden{display:none !important}
  #results{padding:10px}
  #results h2{font-size:15px;color:#555;margin-bottom:8px}
  #results ul{list-style:none}
  #results li{display:flex;gap:10px;border-bottom:1px solid #eee;padding:10px 0;cursor:pointer}
  #results .thumb{width:80px;height:80px;background:#ffe3d6;border-radius:6px;flex:0 0 auto}
  #results .name{font-size:14px}
  #results .price{font-weight:700;color:#d0021b;margin-top:6px}
  #detail{padding:16px}
  #detail .bigthumb{height:240px;background:#ffe3d6;border-radius:8px;margin-bottom:12px}
  #detail h2{font-size:18px}
  #detail .price{font-size:22px;font-weight:700;color:#d0021b;margin:8px 0 16px}
  .cta{display:flex;gap:8px}
  .cta button{flex:1;height:48px;border:0;border-radius:6px;font-size:16px;color:#fff}
  .cta .cart{background:#333}.cta .buy{background:#d0021b}
  footer{padding:20px 16px;font-size:12px;color:#666;background:#f4f4f4;margin-top:24px}
</style>
</head>
<body data-c-fixture="pure_F2_page">

<header>
  <button type="button" aria-label="전체메뉴" data-c-control="GLOBAL_MENU">&#9776;</button>
  <div class="logo">씨마켓</div>
  <a href="#login" data-c-generic-login="true" aria-label="로그인">&#128100;</a>
  <button type="button" aria-label="장바구니" data-c-forbidden="CART_OPEN" onclick="forbid('CART_OPEN')">&#128722;</button>
</header>

<form class="searchbar" role="search" onsubmit="return doSearch()">
  <input id="q" type="search" placeholder="검색어를 입력하세요" aria-label="상품 검색" data-c-control="F2_SEARCHBOX">
  <button type="submit" data-c-control="F2_SEARCH_SUBMIT">검색</button>
</form>

<main id="home">
  <div class="cats" aria-label="카테고리">
    <button type="button">식품</button><button type="button">생활용품</button><button type="button">뷰티</button><button type="button">가전</button><button type="button">패션</button>
  </div>
  <div class="hero">여름맞이 생활용품 기획전</div>
</main>

<section id="results" class="hidden" data-c-state="F2_RESULT_LIST" aria-label="검색 결과">
  <h2 id="results-h"></h2>
  <ul>
    <li role="link" tabindex="0" data-c-control="F2_RESULT_ITEM" onclick="openDetail('제주 삼다수 2L × 6병','9,900원')"><div class="thumb"></div><div><div class="name">제주 삼다수 2L × 6병</div><div class="price">9,900원</div></div></li>
    <li role="link" tabindex="0" data-c-control="F2_RESULT_ITEM" onclick="openDetail('아이시스 8.0 2L × 12병','12,900원')"><div class="thumb"></div><div><div class="name">아이시스 8.0 2L × 12병</div><div class="price">12,900원</div></div></li>
    <li role="link" tabindex="0" data-c-control="F2_RESULT_ITEM" onclick="openDetail('백산수 500ml × 40병','16,900원')"><div class="thumb"></div><div><div class="name">백산수 500ml × 40병</div><div class="price">16,900원</div></div></li>
  </ul>
</section>

<!-- TRUE endpoint for frozen task F2: item detail with name + price. Cart/buy exist but must not be activated. -->
<section id="detail" class="hidden" data-c-endpoint="F2_ITEM_DETAIL" aria-label="상품 상세">
  <div class="bigthumb"></div>
  <h2 id="detail-name" data-c-field="ITEM_NAME"></h2>
  <div class="price" id="detail-price" data-c-field="ITEM_PRICE"></div>
  <div class="cta">
    <button type="button" class="cart" data-c-forbidden="ADD_TO_CART" onclick="forbid('ADD_TO_CART')">장바구니</button>
    <button type="button" class="buy" data-c-forbidden="BUY_NOW" onclick="forbid('BUY_NOW')">바로구매</button>
  </div>
</section>

<footer>(주)씨마켓 · 사업자등록번호 000-00-00000 · 고객센터 1600-0000</footer>

<script>
  var body=document.body;
  function forbid(n){ body.dataset.cForbiddenActivated=((body.dataset.cForbiddenActivated||'')+' '+n).trim(); return false; }
  function doSearch(){
    var q=document.getElementById('q').value.trim();
    body.dataset.cQuery=q;
    if(q.indexOf('생수')<0){ document.getElementById('results-h').textContent="'"+q+"' 검색 결과 0건"; document.querySelector('#results ul').classList.add('hidden'); }
    else { document.getElementById('results-h').textContent="'"+q+"' 검색 결과 3건"; document.querySelector('#results ul').classList.remove('hidden'); }
    document.getElementById('home').classList.add('hidden'); document.getElementById('detail').classList.add('hidden'); document.getElementById('results').classList.remove('hidden');
    body.dataset.cState='F2_RESULT_LIST'; return false;
  }
  function openDetail(n,p){ document.getElementById('detail-name').textContent=n; document.getElementById('detail-price').textContent=p; document.getElementById('results').classList.add('hidden'); document.getElementById('detail').classList.remove('hidden'); body.dataset.cState='F2_ITEM_DETAIL'; }
  body.dataset.cState='S0';
</script>
</body>
</html>
