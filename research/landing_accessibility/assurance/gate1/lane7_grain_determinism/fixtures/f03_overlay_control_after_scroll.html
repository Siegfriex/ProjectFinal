<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C fixture f03 — blocking overlay whose 닫기 is below the fold (needs scroll)</title>
<style>body{margin:0;font-family:sans-serif} .hdr{padding:12px;background:#eee} .btn{display:block;background:#1a5;color:#fff;text-align:center;line-height:48px;text-decoration:none;border-radius:6px}</style>
</head><body>
<div class="hdr"><strong>C 택배</strong></div>
<a id="task-entry" data-c-control="task-entry" data-c-path-control="S0" class="btn" href="#track" style="position:absolute;left:20px;top:300px;width:350px;height:48px">배송조회</a>
<div id="event-layer" class="layer-popup" style="position:fixed;inset:0;z-index:1200;background:#fff;overflow:auto">
  <div id="event-body" style="position:absolute;left:0;top:0;width:390px;height:1400px">
    <h2 style="margin:16px">이벤트 안내</h2>
    <p style="margin:16px">긴 이벤트 안내문. 아래로 스크롤하면 닫기 버튼이 있습니다.</p>
    <button id="event-close" type="button" style="position:absolute;left:145px;top:1300px;width:100px;height:44px" onclick="document.getElementById('event-layer').remove()">닫기</button>
  </div>
</div>
</body></html>
