<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C fixture f02 — overlay whose dismiss control exists but is hidden</title>
<style>body{margin:0;font-family:sans-serif} .hdr{padding:12px;background:#eee} .btn{display:block;background:#1a5;color:#fff;text-align:center;line-height:48px;text-decoration:none;border-radius:6px}</style>
</head><body>
<div class="hdr"><strong>C 택배</strong></div>
<a id="task-entry" data-c-control="task-entry" class="btn" href="#track" style="position:absolute;left:20px;top:300px;width:350px;height:48px">배송조회</a>
<div id="ad-layer" class="layer-popup" style="position:fixed;left:0;top:200px;width:390px;height:300px;z-index:900;background:#ffe">
  <p style="margin:16px">광고: 5초 후 닫기 버튼이 나타납니다.</p>
  <span aria-hidden="true"><button id="ad-close-ghost" type="button" style="position:absolute;left:0;top:0;width:0;height:0;padding:0;border:0">닫기</button></span>
  <button id="ad-close" type="button" style="display:none;position:absolute;left:300px;top:8px;width:80px;height:40px" onclick="document.getElementById('ad-layer').remove()">닫기</button>
  <button id="ad-confirm" type="button" style="position:absolute;left:145px;top:230px;width:100px;height:44px" onclick="document.getElementById('ad-layer').remove()">확인</button>
</div>
<script>setTimeout(function(){document.getElementById('ad-close').style.display='block'},5000)</script>
</body></html>
