<!doctype html>

<html lang="ko"><head><meta charset="utf-8"><title>CASE2 로그인</title>
<style>body{margin:0;padding:16px;font-family:system-ui,sans-serif}label{display:block;margin-top:12px}
input{display:block;width:100%;min-height:48px;box-sizing:border-box;font-size:16px}

<body data-fixture="case2_login_gate" data-gate-kind="LOGIN">
<h1 style="font-size:20px">로그인</h1>

<label for="uid">아이디</label><input id="uid" name="userId" type="text" autocomplete="username">
<label for="pw">비밀번호</label><input id="pw" name="password" type="password" autocomplete="current-password">

</form>
</body></html>
