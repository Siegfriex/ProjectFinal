<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W5J 단일 state 대조군</title>
<!--
FIXTURE: scroll_single_state
검증 대상: 고정 scroll 정책이 **없는 state 를 만들지 않는다**.

문서 전체가 한 viewport(390x844 CSS px) 안에 들어간다. 실측
document.documentElement.scrollHeight = **844** = window.innerHeight 이므로 최대 scroll
위치는 **0** 이고, window.scrollTo(0, 844) 를 불러도 scrollY 는 0 에 머문다. 따라서
어떤 보폭을 써도 나올 수 있는 state 는 **S0 하나**다.

scroll_reveal_control 과 짝이 되는 **음성 대조군**이다 — 걷기가 무조건 S1 을 만들어내는
것이 아님을 보인다. 대조군 없이 "스크롤 된다" 만 보이면 검사가 동작하는지 알 수 없다.

W5E 의 fixtures/v3/ 13종은 전부 한 viewport 에 들어가 S1 이 생기지 않는다고 보고됐다.
그 13종은 손대지 않고, 이 lane 이 쓸 짝을 여기에 따로 만든다.
-->
<style>
  body { margin: 0; font-family: sans-serif; }
  .cta {
    display: inline-block; padding: 12px 20px;
    font-size: 16px; border: 1px solid #333; background: #fff; color: #111;
  }
</style>
</head>
<body>
  <h1 style="margin:0;padding:16px;font-size:20px">한 화면</h1>
  <p style="padding:0 16px">문서 전체가 최초 viewport 안에 있다.</p>
  <button class="cta" id="ctl-s0" data-role="cta">지금 신청하기</button>
</body>
</html>
