<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중첩 메뉴 — W5E v3 픽스처</title>
<style>
 *{box-sizing:border-box}
 [hidden]{display:none !important}
 body{margin:0;width:390px;height:844px;background:#fff;color:#111;
      font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
 .hdr{margin:0;height:56px;line-height:56px;padding-left:16px;font-size:17px;
      font-weight:600;border-bottom:1px solid #ddd}
 .trigger{position:fixed;left:334px;top:8px;width:40px;height:40px;
          border:0;background:transparent;color:#111;padding:0;line-height:0}
 .ico{display:inline-block;width:22px;height:14px;
      border-top:2px solid currentColor;border-bottom:2px solid currentColor}
 .panel{position:fixed;left:0;top:56px;width:390px;height:200px;
        background:#f4f6f9;border-bottom:1px solid #ccc}
 .cat{position:fixed;left:20px;top:72px;width:200px;height:48px;
      border:1px solid #0b4f9e;border-radius:8px;background:#fff;color:#0b4f9e;font-size:16px}
 .task{position:fixed;left:20px;top:128px;width:200px;height:48px;
       border:0;border-radius:8px;background:#0b4f9e;color:#fff;font-size:16px}
</style></head>
<body data-fixture="nested_menu">
<h1 class="hdr">시외버스 예매</h1>
<button type="button" class="trigger" id="open" aria-label="전체메뉴 열기" aria-expanded="false"><span class="ico" aria-hidden="true"></span></button>
<nav class="panel" id="panel" hidden aria-label="전체메뉴">
<button type="button" class="cat" id="cat" aria-expanded="false">고속·시외</button>
<div class="sub" id="sub" hidden>
<button type="button" class="task" id="entry">운행정보 조회</button>
</div>
</nav>
<script>
document.getElementById('open').addEventListener('click', function () {
  document.getElementById('panel').hidden = false;
  this.setAttribute('aria-expanded', 'true');
});
document.getElementById('cat').addEventListener('click', function () {
  document.getElementById('sub').hidden = false;
  this.setAttribute('aria-expanded', 'true');
});
</script>
</body></html>
