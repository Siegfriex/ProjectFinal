<!doctype html>
<!--
FIXTURE: login_first_auth    W5E v3 offline fixture 11/13

검증 대상 (`SSOTV3/04 §4` · `03 §7`): task 를 발견하기 **전에** 로그인이 막는다.
auth_gate_stage=BEFORE_TASK_DISCOVERY · s0_task_control_visible=false ·
endpoint_status=AUTH_GATE · activation_depth=0
(task_flow = AUTH_GATE). task control 은 끝내 관측되지 않으므로
entry_x_norm·entry_y_norm·entry_control_type 등 entry 계열은 NULL 이다.

`03 §7`: generic login 버튼 존재만으로 중단하지 않는다. 여기서는 task-specific path 를
따라간 뒤 auth 가 불가피해지는 순간이 terminal 이다. credential 입력·login submit 은
하지 않는다 — 폼은 **비어 있고** 어떤 값도 미리 채워져 있지 않다.

대조짝: `task_first_auth.html` — DOM 태그 시퀀스도 CSS 도 완전히 같고,
`hidden` 속성이 task 버튼에 붙어 있느냐 gate 폼에 붙어 있느냐 **하나**만 다르다.
그 하나가 auth_gate_stage 를 AFTER_TASK_SELECT ↔ BEFORE_TASK_DISCOVERY 로 가른다.
-->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과업 발견 전 로그인 — W5E v3 픽스처</title>
<style>
 *{box-sizing:border-box}
 [hidden]{display:none !important}
 body{margin:0;width:390px;height:844px;background:#fff;color:#111;
      font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
 .hdr{margin:0;height:56px;line-height:56px;padding-left:16px;font-size:17px;
      font-weight:600;border-bottom:1px solid #ddd}
 .task{position:fixed;left:24px;top:200px;width:200px;height:48px;
       border:0;border-radius:8px;background:#0b4f9e;color:#fff;font-size:16px}
 .gate{position:fixed;left:24px;top:280px;width:342px;height:280px;
       border:1px solid #bbb;border-radius:8px;background:#fafafa;padding:16px}
 .gate label{display:block;margin-top:8px;font-size:14px}
 .gate input{display:block;width:100%;height:48px;margin-top:4px;font-size:16px;
             border:1px solid #888;border-radius:6px;padding:0 12px}
 .submit{margin-top:16px;width:100%;height:48px;border:0;border-radius:8px;
         background:#0b4f9e;color:#fff;font-size:16px}
</style></head>
<body data-fixture="login_first_auth">
<h1 class="hdr">시외버스 예매</h1>
<main class="page">
<button type="button" class="task" id="entry" hidden>예매내역 조회</button>
<form class="gate" id="gate" aria-label="로그인">
<label for="uid">아이디</label>
<input id="uid" name="uid" type="text" autocomplete="off">
<label for="pw">비밀번호</label>
<input id="pw" name="pw" type="password" autocomplete="off">
<button type="button" class="submit" id="go">로그인</button>
</form>
</main>
<script>
document.getElementById('entry').addEventListener('click', function () {
  document.getElementById('gate').hidden = false;
});
</script>
</body></html>
