<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><title>대표기능 가림 픽스처</title>
  <style>
    body { margin: 0; position: relative; }
    main { padding: 16px; }
    .primary-action { position: absolute; top: 100px; left: 16px; width: 200px; height: 44px;
      display: inline-block; background: #0057d8; color: #fff; }
    .overlay { position: absolute; top: 100px; left: 16px; width: 200px; height: 44px;
      background: rgba(255,255,255,.95); z-index: 500; }
  </style>
</head>
<body>
  <main>
    <h1>합성 서비스</h1>
    <a href="#" class="primary-action" data-primary-action="true">대표기능 시작</a>
  </main>
  <div class="overlay" role="dialog"><p>쿠팡 특가! 오늘만 이 가격</p></div>
</body>
</html>
