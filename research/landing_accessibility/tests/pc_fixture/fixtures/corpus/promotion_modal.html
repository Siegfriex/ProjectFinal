<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><title>프로모션 모달 픽스처</title>
  <style>
    .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 60vh; background: rgba(0,0,0,.5); z-index: 500; }
    .close { min-width: 44px; min-height: 44px; }
    .primary-action { min-width: 88px; min-height: 44px; display: inline-block; }
  </style>
</head>
<body>
  <main><h1>합성 서비스</h1><a href="#" class="primary-action" data-primary-action="true">대표기능 시작</a></main>
  <div class="overlay" role="dialog" aria-modal="true">
    <p>신규가입 이벤트! 지금 참여하면 사은품 증정</p>
    <button class="close dismiss" aria-label="닫기">닫기</button>
  </div>
</body>
</html>
